<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Кейсов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1a1a24; color: white; font-family: Arial, sans-serif; text-align: center; padding: 20px; margin: 0; }
        h1 { font-size: 24px; }
        .balance { font-size: 18px; color: #ffcc00; margin-bottom: 20px; }
        .case-container { display: flex; justify-content: center; margin-top: 30px; }
        .case { background: #2a2a35; padding: 20px; border-radius: 15px; cursor: pointer; border: 2px solid #3a3a45; transition: 0.2s; width: 200px; }
        .case:active { transform: scale(0.95); border-color: #ffcc00; }
        .case img { width: 120px; height: 120px; }
        #result { margin-top: 30px; font-size: 20px; font-weight: bold; min-height: 60px; }
        .spinning { animation: spin 0.5s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>Симулятор Кейсов</h1>
    <div class="balance">Твой баланс: <span id="user-balance">Загрузка...</span> монет</div>

    <div class="case-container">
        <div class="case" id="case-btn" onclick="openCase()">
            <img id="case-img" src="https://cdn-icons-png.flaticon.com/512/4213/4213542.png" alt="Кейс">
            <p>Стартовый кейс</p>
            <p style="color: #aaa; font-size: 14px;">500 монет</p>
        </div>
    </div>

    <div id="result"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
        
        // ВСТАВЬ СЮДА СВОЙ ТОКЕН!
        const BOT_TOKEN = "9096961860:AAG-KvInPwukP5d_U3rib53cX1QR-DXL-5w"; 
        
        let currentBalance = 0;
window.onerror = function(message, source, lineno, colno, error) {
    document.getElementById('result').innerHTML = <span style="color:red; font-size:14px;">ОШИБКА:<br>${message}</span>;
};

        async function sendActionToBot(action) {
            const url = https://api.telegram.org/bot${BOT_TOKEN}/sendMessage;
            const data = { chat_id: userId, text: action, disable_notification: true };
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await response.json();
            } catch (error) { console.error("Ошибка:", error); }
        }

        async function getBalance() {
            if (!userId) return;
            await sendActionToBot('/my_web_balance'); 
        }

        async function openCase() {
            if (!userId) return;
            const resultDiv = document.getElementById('result');
            const img = document.getElementById('case-img');
            resultDiv.innerHTML = "Крутим... 🎰";
            img.classList.add('spinning');
            const response = await sendActionToBot('/open_case_web');
            setTimeout(() => {
                img.classList.remove('spinning');
                if (response && response.ok) {
                    resultDiv.innerHTML = "Кейс открыт! Проверь чат с ботом 👇";
                    getBalance();
                } else {
                    resultDiv.innerHTML = "Ошибка! Проверь баланс.";
                }
            }, 1500);
        }
        getBalance();
    </script>
</body>
</html>
